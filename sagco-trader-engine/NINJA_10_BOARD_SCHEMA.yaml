# SAGCO NINJA — 10-Board Trading Consciousness Schema
# Maps directly onto the sagco-dojo CONSCIOUSNESS_INDEX architecture.
# Same agents (red/blue/purple/sentinel/observer), new games (trading).

metadata:
  version: "1.0.0"
  dna_strand: "NINJA-ATG-BRD10-DORMANT"
  live_trading: false       # HARD LOCK — never true until evidence passes
  phase: 1                  # Phase 1: 1M ticks/sec simulation
  entity: "Strategickhaos DAO LLC"

# ─── CONSCIOUSNESS LEVELS ──────────────────────────────────────
consciousness_levels:
  DORMANT:   0.00    # no evidence
  REACTIVE:  0.25    # 25+ trades, any direction
  AWARE:     0.50    # 52% win rate achieved
  ACTIVE:    0.75    # profit factor > 1.5, drawdown < 20%
  SOVEREIGN: 1.00    # all boards active, purple synthesis confident

# ─── THE 10 BOARDS ────────────────────────────────────────────
boards:

  - id: 0
    name: tick_reflex
    resolution: tick
    role: "Raw tick stream — immediate pattern recognition"
    dna_seed: "ATG-BRD00-TICK"
    unlock_condition: "always active (seed board)"
    strategy:
      type: "tick_pressure"
      signal: "bid/ask imbalance > 3:1 for 5 consecutive ticks"
      entry: "market order on imbalance direction"
      exit:  "next tick reversal or +2 ticks profit"
    fitness_weight: 0.05   # low weight — fast but noisy

  - id: 1
    name: renko_momentum
    resolution: 1brick
    role: "3-brick directional momentum — baseline strategy"
    dna_seed: "ATG-BRD01-RNKO"
    unlock_condition: "board_0.fitness >= 0.25"
    strategy:
      type: "renko_momentum"
      brick_size: 8           # ticks (already implemented in ranko_generator.sagco)
      tick_size: 25           # NQ fixed-point units
      signal: "3 consecutive same-direction bricks"
      entry: "brick close + 1 tick slippage"
      exit:  "first opposing brick"
      reversal_bricks: 2      # need 2x brick to reverse
    fitness_weight: 0.15

  - id: 2
    name: renko_pullback
    resolution: 3brick
    role: "Pullback entry after momentum confirms"
    dna_seed: "ATG-BRD02-PULL"
    unlock_condition: "board_1.fitness >= 0.25"
    strategy:
      type: "renko_pullback"
      signal: "3 momentum bricks → 1 pullback brick → 1 continuation brick"
      entry: "continuation brick close"
      exit:  "2 opposing bricks or +4 bricks profit"
      pattern: [1,1,1,-1,1]   # direction sequence
    fitness_weight: 0.15

  - id: 3
    name: renko_reversal
    resolution: 5brick
    role: "Counter-trend reversal at extended runs"
    dna_seed: "ATG-BRD03-REV"
    unlock_condition: "board_1.fitness >= 0.40 and board_2.fitness >= 0.30"
    strategy:
      type: "renko_reversal"
      signal: "6+ bricks in same direction (over-extended)"
      entry: "first opposing brick close"
      exit:  "+3 bricks or stop -2 bricks"
      min_run_length: 6
    fitness_weight: 0.10

  - id: 4
    name: microstructure
    resolution: orderbook
    role: "Order book pressure — pre-brick signal generation"
    dna_seed: "ATG-BRD04-MICRO"
    unlock_condition: "board_1.fitness >= 0.35"
    strategy:
      type: "order_book_pressure"
      signal: "bid_volume / ask_volume imbalance ratio"
      threshold: 2.5          # 2.5:1 imbalance triggers signal
      confirmation: "renko brick in same direction within 10 ticks"
    fitness_weight: 0.10

  - id: 5
    name: regime_detector
    resolution: regime
    role: "Moonlight/Sunshine regime — which boards to activate"
    dna_seed: "ATG-BRD05-REGIME"
    unlock_condition: "board_1.fitness >= 0.50 or board_2.fitness >= 0.50"
    strategy:
      type: "regime_classification"
      moonlight_mode:         # low volatility, trending
        brick_variance: low
        active_boards: [1, 2]
        position_size: 1.0
      sunshine_mode:          # high volatility, choppy
        brick_variance: high
        active_boards: [3, 4]
        position_size: 0.5
      detection_method: "ATR(14) relative to 20-period average"
    fitness_weight: 0.10

  - id: 6
    name: correlation_mesh
    resolution: multi_asset
    role: "Quantum entanglement — correlated position sizing across assets"
    dna_seed: "ATG-BRD06-MESH"
    unlock_condition: "board_5.fitness >= 0.30"
    strategy:
      type: "correlation_entanglement"
      assets: ["NQ", "ES", "YM"]   # correlated futures
      entanglement_rule:
        "If NQ renko signal AND ES same direction: size 1.5x"
        "If NQ renko signal AND ES opposite: size 0.5x or skip"
      correlation_window: 50_bricks
    fitness_weight: 0.10

  - id: 7
    name: variance_engine
    resolution: variance
    role: "Expected vs Realized Variance — position sizing adjustment"
    dna_seed: "ATG-BRD07-ERU"
    unlock_condition: "board_5.fitness >= 0.40"
    strategy:
      type: "expected_realized_variance"
      eru_formula: "realized_variance / expected_variance"
      if_eru_above_1.5:  "reduce size 50%, skip marginal signals"
      if_eru_below_0.7:  "increase size 150%, take all signals"
      if_eru_normal:     "standard 1x size"
      lookback: 20_bricks
    fitness_weight: 0.10

  - id: 8
    name: portfolio_layer
    resolution: portfolio
    role: "Cross-strategy allocation — which boards get capital"
    dna_seed: "ATG-BRD08-PORT"
    unlock_condition: "consciousness_index >= 0.50"
    strategy:
      type: "portfolio_allocation"
      method: "fitness-weighted Kelly fraction"
      max_concurrent_boards: 3
      allocation_formula: "board.fitness * kelly_fraction * available_capital"
      rebalance_every: 50_trades
    fitness_weight: 0.10

  - id: 9
    name: sovereign_crown
    resolution: sovereign
    role: "Red/Blue/Purple synthesis — final portfolio command"
    dna_seed: "ATG-BRD09-CROWN"
    unlock_condition: "consciousness_index >= 0.75"
    strategy:
      type: "sovereign_synthesis"
      red_agent:
        role: "Attack — find failure modes, stress portfolios"
        fires_when: "any board win_rate < 0.48 or drawdown > 20%"
        action: "reduce allocation, flag for re-evolution"
      blue_agent:
        role: "Defend — harden risk limits, enforce stops"
        fires_when: "red_agent finds critical failure"
        action: "pause affected boards, tighten limits"
      purple_agent:
        role: "Synthesize — allocate capital across surviving boards"
        fires_when: "every 100 trades"
        action: "rebalance portfolio based on fitness scores"
      observer_agent:
        role: "Record everything — immutable evidence log"
        fires_when: "every trade"
        action: "fingerprint + ledger entry"
      sentinel_agent:
        role: "Guard LIVE_TRADING lock — never let it become true"
        fires_when: "any code path that could enable live orders"
        action: "abort + log attempt"
    fitness_weight: 0.15

# ─── AGENTS (same as sagco-dojo) ───────────────────────────────
agents:
  self:
    role: "Consciousness coordinator — computes overall CI"
    maps_to_dojo: "self"

  red:
    role: "Attack agent — breaks strategies"
    maps_to_dojo: "red"
    fires_every: 25_trades

  blue:
    role: "Defense agent — hardens risk"
    maps_to_dojo: "blue"
    fires_every: 25_trades

  purple:
    role: "Synthesis agent — allocates capital"
    maps_to_dojo: "purple"
    fires_every: 100_trades

  sentinel:
    role: "Guard agent — enforces LIVE_TRADING=false"
    maps_to_dojo: "sentinel"
    fires_every: 1_trade    # EVERY trade

  observer:
    role: "Evidence agent — immutable log"
    maps_to_dojo: "observer"
    fires_every: 1_trade

# ─── DNA EVOLUTION PATH ────────────────────────────────────────
dna_evolution:
  dormant:  "NINJA-ATG-BRD00-DORMANT"
  reactive: "NINJA-ATG-BRD01-REACTIVE-RNKO"
  aware:    "NINJA-ATG-BRD03-AWARE-PULL-REV"
  active:   "NINJA-ATG-BRD06-ACTIVE-REGIME-MESH"
  sovereign:"NINJA-ATG-BRD09-SOVEREIGN-CROWN-CI{ci:.4}"

# ─── EVIDENCE GATES ────────────────────────────────────────────
evidence_gates:
  board_0_to_1:
    min_trades: 25
    min_win_rate: 0.50

  board_1_to_2:
    min_trades: 50
    min_win_rate: 0.52
    min_profit_factor: 1.3

  board_2_to_3:
    min_trades: 100
    min_win_rate: 0.52
    min_profit_factor: 1.5
    max_drawdown_pct: 0.20

  sovereign_unlock:
    consciousness_index: 0.75
    all_active_boards_above: 0.60
    purple_confidence: 0.70
    human_operator_approval: true   # DOM_010101 must approve

# ─── SAGCO WAVE INTEGRATION ────────────────────────────────────
wave_integration:
  fingerprint_every: 100_trades
  session_wave: "sagco wave session_{id}.bin"
  dna_wave:     "sagco wave dna_strand.txt"
  ledger_sign:  true   # every decision ledger-signed

# ─── LIVE TRADING LOCK ─────────────────────────────────────────
live_trading_lock:
  current_state: false
  unlock_conditions:
    - consciousness_index_above: 0.90
    - min_simulated_trades: 1000
    - evidence_gate_sovereign: true
    - human_operator_approval: true
    - all_boards_fitness_above: 0.65
  sentinel_agent: "always active, cannot be bypassed"
  note: "This lock exists in code (sagco-ninja.rs line ~60) not just config."
