# sagco-pxe.conf
# SAGCO dnsmasq PXE configuration
# Copy to: /etc/dnsmasq.d/sagco-pxe.conf
# Replace SERVER_IP with Lyra's WSL2 IP (after mirrored networking) or Pi 5 IP

# Bind to physical interface
interface=eth0
bind-interfaces

# Proxy DHCP mode — attaches to existing DHCP, does NOT replace your router
# Your router still assigns IPs. This only adds PXE boot info.
dhcp-range=192.168.1.0,proxy

# Log every DHCP/PXE request — tail /var/log/syslog to watch the HP appear
log-dhcp

# ── UEFI boot (HP OmniDesk with UEFI enabled) ────────────────────────────
# Client type 7 = x86-64 EFI
pxe-service=x86-64_EFI,"SAGCO Node Boot (UEFI 64)",efi64/grub.efi,SERVER_IP

# ── Legacy BIOS fallback ──────────────────────────────────────────────────
pxe-service=0,"SAGCO Node Boot (BIOS)",bios/pxelinux.0,SERVER_IP

# ── TFTP ─────────────────────────────────────────────────────────────────
enable-tftp
tftp-root=/srv/tftp

# Optional: point specific MAC address to specific boot image
# dhcp-host=aa:bb:cc:dd:ee:ff,hp-omnidesk,192.168.1.50
