# SAGCO PXE Node — grub.cfg
# Place at: /srv/tftp/grub/grub.cfg
# This is served over TFTP to the HP OmniDesk after it gets a PXE response.

set timeout=15
set default=0

# Colors
set menu_color_normal=white/black
set menu_color_highlight=black/white

echo "SAGCO Node Boot Menu"
echo "HP OmniDesk — Network Boot"
echo ""

menuentry "SAGCO Node — Alpine Linux (UEFI Netboot)" {
    echo "Loading SAGCO kernel..."
    linuxefi  /efi64/vmlinuz-lts \
        ip=dhcp \
        alpine_repo=https://dl-cdn.alpinelinux.org/alpine/v3.20/main \
        modloop=https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86_64/netboot/modloop-lts \
        sagco_node=hp-omnidesk \
        console=tty0 \
        quiet
    echo "Loading initramfs..."
    initrdefi /efi64/initramfs-lts
}

menuentry "SAGCO Node — Shell + SAGCO daemon (NFS root)" {
    echo "Loading SAGCO minimal shell..."
    linuxefi  /efi64/vmlinuz-lts \
        ip=dhcp \
        root=/dev/nfs \
        nfsroot=SERVER_IP:/srv/nfs/sagco-boot \
        rw \
        sagco_node=hp-omnidesk \
        sagco_server=SERVER_IP \
        init=/sagco/node_init.sh \
        console=tty0
    initrdefi /efi64/initramfs-lts
}

menuentry "Boot from local disk (escape hatch)" {
    exit
}
