  required:
    - artifact_id     # ART-YYYYMMDD_HHMMSS-DEVICE
    - device          # fleet device key
    - ssh_key_label   # which key authenticated the push
    - gpg_key_id      # AE5519579584DEF5 (signing subkey)
    - timestamp       # YYYYMMDD_HHMMSS
    - project         # derived from Cargo.toml or PWD
    - parent          # what triggered this artifact
    - hash            # sha256 of artifact content
