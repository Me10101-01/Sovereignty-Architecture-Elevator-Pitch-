# Orchestration Compose - Phases 1-7 Full Integration
# Sovereignty Architecture Emulator with Swarm Bot Recursive Evolution

version: '3'

services:
  # Phase 1: Bootstrap Tree Initialization
  bootstrap:
    build: phase1/
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    volumes:
      - .:/app
    networks:
      - sovereignty_network

  # Phase 2: Prior Art Guards Enforcement
  guards:
    build: phase2/
    depends_on:
      - bootstrap
    volumes:
      - .:/app
    networks:
      - sovereignty_network

  # Phase 3: Quantum Components Deployment
  quantum:
    build: phase3/
    depends_on:
      - guards
    volumes:
      - .:/app
    networks:
      - sovereignty_network

  # Phase 4: Register Memory Integration
  memory:
    build: phase4/
    depends_on:
      - quantum
    volumes:
      - .:/app
    networks:
      - sovereignty_network

  # Phase 5: Full Integration and Recursive Evolution (Swarm Bot Activation)
  integration:
    build: phase5/
    depends_on:
      - memory
    volumes:
      - .:/app
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    entrypoint: python integrate.py
    networks:
      - sovereignty_network

  # Phase 6: Superposition Expansion and Ripley Gates Exploration
  superposition:
    build: phase6/
    depends_on:
      - integration
    volumes:
      - .:/app
    entrypoint: python expand_claim8.py
    networks:
      - sovereignty_network

  # Phase 7: Ripley 12 Gates Deepening, SAGCO Evolution, and Benchmarks
  ripley_sagco_bench:
    build: phase7/
    depends_on:
      - superposition
    volumes:
      - .:/app
    entrypoint: python deepen_ripley_explore_sagco.py
    networks:
      - sovereignty_network

networks:
  sovereignty_network:
    driver: bridge
