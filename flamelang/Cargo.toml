[workspace]
members = [
    "flametoken",
    "flame-lexer",
    "flame-parser",
    "flame-transform",
    "flame-codegen",
    "flame-ffi",
    "sagco-organism",
]
resolver = "2"

[workspace.package]
version        = "0.2.0"
edition        = "2021"
authors        = ["Domenic Gabriel Garza <garza.domenic101@gmail.com>"]
license        = "LicenseRef-StrategicKhaos-Proprietary"
repository     = "https://github.com/me10101-01/sovereignty-architecture-elevator-pitch-"
rust-version   = "1.75"

[workspace.dependencies]
sha2             = "0.10"
hex              = "0.4"
serde            = { version = "1.0", features = ["derive"] }
serde_json       = "1.0"
tokio            = { version = "1.0", features = ["full"] }
lettre           = { version = "0.11", features = ["tokio1-native-tls"] }
kube             = { version = "0.88", features = ["client", "runtime"] }
k8s-openapi      = { version = "0.21", features = ["v1_28"] }
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow           = "1.0"
thiserror        = "1.0"
