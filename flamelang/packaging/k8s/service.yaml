apiVersion: v1
kind: Service
metadata:
  name: sagco-organism
  namespace: sagco
  labels:
    app: sagco-organism
spec:
  selector:
    app: sagco-organism
  ports:
    - name: dispatch
      port: 8842
      targetPort: 8842
      protocol: TCP
    - name: genesis
      port: 9137
      targetPort: 9137
      protocol: TCP
  type: ClusterIP
