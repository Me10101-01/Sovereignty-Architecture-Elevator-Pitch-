steps:
  # ── Step 1: Build sagco-bias-core (Rust) ──────────────────────────────────
  - name: "rust:1.78"
    id: build-bias-core
    entrypoint: cargo
    args:
      - build
      - --manifest-path
      - sagco-transistor-biasing-case-study/rust/sagco-bias-core/Cargo.toml
      - --release
    env:
      - "CARGO_HOME=/workspace/.cargo"

  # ── Step 2: Run cargo test ─────────────────────────────────────────────────
  - name: "rust:1.78"
    id: test-bias-core
    entrypoint: cargo
    args:
      - test
      - --manifest-path
      - sagco-transistor-biasing-case-study/rust/sagco-bias-core/Cargo.toml
    env:
      - "CARGO_HOME=/workspace/.cargo"

  # ── Step 3: Run binary — Omni example + ERU validation ────────────────────
  - name: "rust:1.78"
    id: run-bias-core
    entrypoint: cargo
    args:
      - run
      - --manifest-path
      - sagco-transistor-biasing-case-study/rust/sagco-bias-core/Cargo.toml
      - --bin
      - sagco-bias-core
    env:
      - "CARGO_HOME=/workspace/.cargo"

  # ── Step 4: Docker build — sagco-bias-core container ─────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: docker-build
    args:
      - build
      - -t
      - "dom101/sagco-bias-core:$SHORT_SHA"
      - -t
      - "dom101/sagco-bias-core:latest"
      - sagco-transistor-biasing-case-study/rust/sagco-bias-core

  # ── Step 5: Docker Hub login (credentials from Secret Manager) ────────────
  # Requires: Secret Manager secret named "dockerhub-token" in this project
  # To create: gcloud secrets create dockerhub-token --data-file=token.txt
  - name: "gcr.io/cloud-builders/docker"
    id: docker-login
    entrypoint: bash
    args:
      - "-c"
      - |
          echo "$$DOCKERHUB_TOKEN" | docker login \
            --username dom101 \
            --password-stdin
    secretEnv:
      - DOCKERHUB_TOKEN

  # ── Step 6: Docker push to dom101/sagco-bias-core ─────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: docker-push
    args:
      - push
      - --all-tags
      - "dom101/sagco-bias-core"

  # ── Step 7: Seal status ───────────────────────────────────────────────────
  - name: "bash"
    id: status-seal
    entrypoint: bash
    args:
      - "-c"
      - |
          mkdir -p reports
          echo "STATUS=SAGCO_CLOUD_BUILD_PASS"               > reports/cloud_build_status.txt
          echo "IMAGE=dom101/sagco-bias-core:$$SHORT_SHA"   >> reports/cloud_build_status.txt
          echo "BRANCH=$$BRANCH_NAME"                       >> reports/cloud_build_status.txt
          echo "COMMIT=$$SHORT_SHA"                         >> reports/cloud_build_status.txt
          echo "BUILD_ID=$$BUILD_ID"                        >> reports/cloud_build_status.txt
          cat reports/cloud_build_status.txt

# ── Secrets ────────────────────────────────────────────────────────────────────
# Before first run, create the Docker Hub access token in Secret Manager:
#   docker login → Account Settings → Security → New Access Token → copy token
#   echo -n "YOUR_TOKEN" | gcloud secrets create dockerhub-token \
#     --project=SAGCOOSComputConsc --data-file=-
#   gcloud projects add-iam-policy-binding SAGCOOSComputConsc \
#     --member="serviceAccount:$(gcloud projects describe SAGCOOSComputConsc --format='value(projectNumber)')@cloudbuild.gserviceaccount.com" \
#     --role="roles/secretmanager.secretAccessor"
availableSecrets:
  secretManager:
    - versionName: "projects/$PROJECT_ID/secrets/dockerhub-token/versions/latest"
      env: DOCKERHUB_TOKEN

# ── Options ────────────────────────────────────────────────────────────────────
options:
  logging: CLOUD_LOGGING_ONLY

# ── Timeout: 15 minutes ────────────────────────────────────────────────────────
timeout: "900s"
