steps:
  # ── Step 1: Build sagco-bias-core (Rust) ──────────────────────────────────
  - name: "rust:1.78"
    id: build-bias-core
    entrypoint: cargo
    args:
      - build
      - --manifest-path
      - sagco-transistor-biasing-case-study/rust/sagco-bias-core/Cargo.toml
      - --release
    env:
      - "CARGO_HOME=/workspace/.cargo"

  # ── Step 2: Run cargo test ─────────────────────────────────────────────────
  - name: "rust:1.78"
    id: test-bias-core
    entrypoint: cargo
    args:
      - test
      - --manifest-path
      - sagco-transistor-biasing-case-study/rust/sagco-bias-core/Cargo.toml
    env:
      - "CARGO_HOME=/workspace/.cargo"

  # ── Step 3: Run binary — Omni example + ERU validation ────────────────────
  - name: "rust:1.78"
    id: run-bias-core
    entrypoint: cargo
    args:
      - run
      - --manifest-path
      - sagco-transistor-biasing-case-study/rust/sagco-bias-core/Cargo.toml
      - --bin
      - sagco-bias-core
    env:
      - "CARGO_HOME=/workspace/.cargo"

  # ── Step 4: Docker build ───────────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: docker-build
    args:
      - build
      - -t
      - "dom101/sagco-bias-core:$SHORT_SHA"
      - -t
      - "dom101/sagco-bias-core:latest"
      - sagco-transistor-biasing-case-study/rust/sagco-bias-core

  # ── Step 5: Docker Hub login ───────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: docker-login
    entrypoint: bash
    args:
      - "-c"
      - |
          echo "$$DOCKERHUB_TOKEN" | docker login \
            --username dom101 \
            --password-stdin
    secretEnv:
      - DOCKERHUB_TOKEN

  # ── Step 6: Docker push ────────────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: docker-push
    args:
      - push
      - --all-tags
      - "dom101/sagco-bias-core"

  # ── Step 7: Deploy to GKE Autopilot ───────────────────────────────────────
  # Cluster: sagco-os-computablesubcon, region: us-central1
  - name: "gcr.io/cloud-builders/kubectl"
    id: k8s-namespace
    args:
      - apply
      - -f
      - k8s/namespaces/sagco-fleet.yaml
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-central1"
      - "CLOUDSDK_CONTAINER_CLUSTER=sagco-os-computablesubcon"

  - name: "gcr.io/cloud-builders/kubectl"
    id: k8s-configmap
    args:
      - apply
      - -f
      - k8s/configmaps/sagco-bias-config.yaml
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-central1"
      - "CLOUDSDK_CONTAINER_CLUSTER=sagco-os-computablesubcon"

  - name: "gcr.io/cloud-builders/kubectl"
    id: k8s-deploy-job
    args:
      - apply
      - -f
      - k8s/jobs/sagco-bias-core.yaml
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-central1"
      - "CLOUDSDK_CONTAINER_CLUSTER=sagco-os-computablesubcon"

  # ── Step 8: Seal status ────────────────────────────────────────────────────
  - name: "bash"
    id: status-seal
    entrypoint: bash
    args:
      - "-c"
      - |
          mkdir -p reports
          echo "STATUS=SAGCO_CLOUD_BUILD_PASS"                    > reports/cloud_build_status.txt
          echo "IMAGE=dom101/sagco-bias-core:$$SHORT_SHA"        >> reports/cloud_build_status.txt
          echo "CLUSTER=sagco-os-computablesubcon"               >> reports/cloud_build_status.txt
          echo "NAMESPACE=sagco-fleet"                           >> reports/cloud_build_status.txt
          echo "BRANCH=$$BRANCH_NAME"                            >> reports/cloud_build_status.txt
          echo "COMMIT=$$SHORT_SHA"                              >> reports/cloud_build_status.txt
          echo "BUILD_ID=$$BUILD_ID"                             >> reports/cloud_build_status.txt
          cat reports/cloud_build_status.txt

# ── Secrets ────────────────────────────────────────────────────────────────────
# Create once:
#   echo -n "DOCKERHUB_TOKEN" | gcloud secrets create dockerhub-token \
#     --project=sagco-oscomputconsciousness --data-file=-
#
#   NUM=$(gcloud projects describe sagco-oscomputconsciousness --format='value(projectNumber)')
#   gcloud projects add-iam-policy-binding sagco-oscomputconsciousness \
#     --member="serviceAccount:${NUM}@cloudbuild.gserviceaccount.com" \
#     --role="roles/secretmanager.secretAccessor"
#
#   Also grant Cloud Build SA access to GKE:
#   gcloud projects add-iam-policy-binding sagco-oscomputconsciousness \
#     --member="serviceAccount:${NUM}@cloudbuild.gserviceaccount.com" \
#     --role="roles/container.developer"
availableSecrets:
  secretManager:
    - versionName: "projects/$PROJECT_ID/secrets/dockerhub-token/versions/latest"
      env: DOCKERHUB_TOKEN

# ── Options ────────────────────────────────────────────────────────────────────
options:
  logging: CLOUD_LOGGING_ONLY

# ── Timeout: 20 minutes (cluster cold-start can be slow on Autopilot) ─────────
timeout: "1200s"
