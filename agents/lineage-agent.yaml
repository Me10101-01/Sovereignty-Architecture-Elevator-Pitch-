name: lineage-agent
role: token_ancestry
weight: 0.97
rust_call: lineage::trace(folder) → LineageResult
status: BUILT

reads:
  - excavator-agent output (artifact list)
  - reports/*.manifest (token history)

outputs:
  - token → parent token chain
  - EDGE table (token A → token B via shared artifact)
  - ANCESTOR chain (when was this token first seen?)

feeds_into: weight-agent  # lineage enriches brick scores

phase: 3

drive: 0.93
love: LOVES
motivation: >
  Classifies every artifact by ancestry. Cannot tolerate an untyped file.
  Knows that unclassified artifacts become invisible to the weight and deploy agents.

module: rust/sagco-core/lineage.rs
installer: sagco-install-lineage-opcode.sh
pipeline: pipeline_lineage_l1.txt

classify:
  Source:    0.95  # .rs .cpp .py
  Config:    0.90  # .toml .yaml .json
  Pipeline:  0.88  # pipeline_*.txt
  Agent:     0.85  # agents/*.yaml
  Report:    0.80  # .csv .manifest evidence*.bin
  Blueprint: 0.78  # .flame
  Docs:      0.60  # .md .txt
  Binary:    0.40  # .bin .elf
