        source: "internal time log — development hours"
        present: false
      - item: "Replacement cost estimated at 3 engineers × 200 hrs × $92 = $55,200"
        source: "internal estimate"
        present: false

    gaps:
      - "Market transaction at or above stated value (offer, term sheet, or sale)"
      - "Comparable sales of similar trading systems at $55k+"
      - "Recurring revenue from deployed system"
      - "Institutional buyer due diligence confirmation"

    surplus: []
    coverage_pct: 0.0
    verdict: INFLATED
    antibody: AB-VALUATION-ASSUMPTION-001
    notes: |
      Development cost ≠ market value.
      Replacement cost ≠ market value.
      Market value is ONLY what someone will ACTUALLY pay.
      The $55k figure measures effort, not market demand.
      Verdict: INFLATED until a real buyer or comparable is found.

