    gap:     "kg_builder.py — registry to graph export"
    status:  "OPEN"
    claim:   "SAGCO-GRAPH-001"
    blocks:  ["Obsidian canvas export", "Neo4j queries", "visual lineage"]

  - id:      "ML-PROBE-001"
    gap:     "sagco node hp probe — live verification of HP node"
    status:  "OPEN"
    claim:   "HP-NODE-001"
    blocks:  ["HP-NODE-001 moving from PROMISING to PROVEN"]

  - id:      "ML-DATASET-001"
    gap:     "One real dataset → full ERU loop end-to-end"
    status:  "OPEN"
    claim:   "TRADE-SIM-001"
    blocks:  ["TRADE-SIM-001 moving from PROMISING to PROVEN"]
