name: SkhaOS Phase Deploy

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Phase to deploy (1-5 or all)'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - 'all'
          - 'evolve'
  push:
    branches:
      - main
      - 'phase/*'
    paths:
      - 'src/**'
      - 'containers/**'
      - 'phases/**'

jobs:
  build-base-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Build base container image
        run: |
          cd containers
          podman build -f Podmanfile -t skhaos-emulator:latest .

      - name: Save image
        run: |
          podman save skhaos-emulator:latest -o /tmp/skhaos-base.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: skhaos-base-image
          path: /tmp/skhaos-base.tar

  deploy-phase-1:
    runs-on: ubuntu-latest
    needs: build-base-image
    if: github.event.inputs.phase == '1' || github.event.inputs.phase == 'all'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: skhaos-base-image
          path: /tmp

      - name: Load image
        run: |
          podman load -i /tmp/skhaos-base.tar

      - name: Deploy Phase 1 (ALU)
        run: |
          chmod +x phases/phase1_alu.sh
          ./phases/phase1_alu.sh

      - name: Verify deployment
        run: |
          podman pod ps | grep skhaos-alu

  deploy-phase-2:
    runs-on: ubuntu-latest
    needs: deploy-phase-1
    if: github.event.inputs.phase == '2' || github.event.inputs.phase == 'all'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: skhaos-base-image
          path: /tmp

      - name: Load image
        run: |
          podman load -i /tmp/skhaos-base.tar

      - name: Deploy Phase 2 (Control Unit)
        run: |
          chmod +x phases/phase2_control.sh
          ./phases/phase2_control.sh

      - name: Verify deployment
        run: |
          podman pod ps | grep skhaos-control

  deploy-phase-3:
    runs-on: ubuntu-latest
    needs: deploy-phase-2
    if: github.event.inputs.phase == '3' || github.event.inputs.phase == 'all'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: skhaos-base-image
          path: /tmp

      - name: Load image
        run: |
          podman load -i /tmp/skhaos-base.tar

      - name: Deploy Phase 3 (Entanglement Core)
        run: |
          chmod +x phases/phase3_entangle.sh
          ./phases/phase3_entangle.sh

      - name: Verify deployment
        run: |
          podman pod ps | grep skhaos-entanglement

  deploy-phase-4:
    runs-on: ubuntu-latest
    needs: deploy-phase-3
    if: github.event.inputs.phase == '4' || github.event.inputs.phase == 'all'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: skhaos-base-image
          path: /tmp

      - name: Load image
        run: |
          podman load -i /tmp/skhaos-base.tar

      - name: Deploy Phase 4 (Register Memory)
        run: |
          chmod +x phases/phase4_register.sh
          ./phases/phase4_register.sh

      - name: Verify deployment
        run: |
          podman pod ps | grep skhaos-register

  evolve-recursive:
    runs-on: ubuntu-latest
    needs: deploy-phase-4
    if: github.event.inputs.phase == 'evolve' || github.event.inputs.phase == 'all'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: skhaos-base-image
          path: /tmp

      - name: Load image
        run: |
          podman load -i /tmp/skhaos-base.tar

      - name: Run recursive evolution
        run: |
          chmod +x phases/evolve_recursive.sh
          ./phases/evolve_recursive.sh

      - name: Upload evolution log
        uses: actions/upload-artifact@v4
        with:
          name: evolution-log
          path: sandbox/evolution_log.json

  test-rust-modules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Run Rust tests
        run: |
          # Note: Tests require Cargo.toml in root
          echo "Rust module tests would run here with proper Cargo.toml"
          echo "Tests are embedded in each module file"

      - name: Check code formatting
        run: |
          echo "Code formatting check placeholder"
