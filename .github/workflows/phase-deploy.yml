name: Phase 11 - Deploy Quantum Emulator

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'quantum-sovereign-emulator/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'quantum-sovereign-emulator/**'
  workflow_dispatch:

jobs:
  validate-yaml:
    name: Validate YAML Thought-Logs
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install PyYAML
        run: pip install pyyaml
      
      - name: Validate thought_log.yaml
        run: |
          python -c "import yaml; yaml.safe_load(open('quantum-sovereign-emulator/configs/thought_log.yaml'))"
          echo "✓ YAML validation passed"
  
  test-parity-checks:
    name: Test Reference Parity Checks
    runs-on: ubuntu-latest
    needs: validate-yaml
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          cd quantum-sovereign-emulator
          pip install -r requirements.txt
      
      - name: Run reference parity checker
        run: |
          cd quantum-sovereign-emulator/src/entanglement_core
          python reference_parity_checker.py
      
      - name: Run Bloom wave cores
        run: |
          cd quantum-sovereign-emulator/src/alu
          python bloom_wave_cores.py
  
  test-integration:
    name: Integration Test - Type Promotion Cube
    runs-on: ubuntu-latest
    needs: test-parity-checks
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          cd quantum-sovereign-emulator
          pip install -r requirements.txt
      
      - name: Run type promotion cube demo
        run: |
          cd quantum-sovereign-emulator/src/cube_simulator
          python type_promotion_cube.py
      
      - name: Run CLI journey sequencer
        run: |
          cd quantum-sovereign-emulator/src/cube_simulator
          python cli_journey_sequencer.py --all --quiet
  
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test-integration
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build thought-log container
        run: |
          cd quantum-sovereign-emulator
          docker build -t thought-log:latest -f docker/thought_log.Dockerfile .
      
      - name: Test container
        run: |
          docker run --rm thought-log:latest python -c "import yaml; print('Container test passed')"
  
  deploy-phase11:
    name: Deploy Phase 11 Components
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy notification
        run: |
          echo "Phase 11 deployment complete"
          echo "Components deployed:"
          echo "  - Thought-log overlay"
          echo "  - Reference parity checker"
          echo "  - Bloom wave cores"
          echo "  - Cognitive cube spec"
          echo "  - Type promotion cube"
          echo "  - CLI journey sequencer"
