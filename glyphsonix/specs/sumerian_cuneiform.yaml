      frequency_hz: 261.63
      type: voiceless_fricative
    - symbol: k
      ipa: /k/
      frequency_hz: 261.63
      type: voiceless_stop
    - symbol: l
      ipa: /l/
      frequency_hz: 293.66
      type: lateral_approximant
    - symbol: m
      ipa: /m/
      frequency_hz: 196.00
      type: nasal
    - symbol: n
      ipa: /n/
      frequency_hz: 220.00
      type: nasal
    - symbol: p
      ipa: /p/
      frequency_hz: 220.00
      type: voiceless_stop
    - symbol: r
