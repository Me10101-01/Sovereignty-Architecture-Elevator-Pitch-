# Sumerian Cuneiform Sonification Layer
# GlyphSonix Resonance Core (GSRC)
# Version: 0.1.0
# Date: December 14, 2025

language: sumerian
script: cuneiform
period: 3400-2000 BCE

# Glyph-to-Audio Mappings
glyphs:
  - symbol: "𒀭"
    unicode: U+12039
    transliteration: DINGIR
    meaning: divine, god, sky
    frequency_hz: 261.63
    note: C4
    wedge_strikes: 5
    duration_ms: 800
    amplitude: 1.0
    
  - symbol: "𒈗"
    unicode: U+12219
    transliteration: LUGAL
    meaning: king, great man
    frequency_hz: 196.00
    note: G3
    wedge_strikes: 4
    duration_ms: 700
    amplitude: 0.95
    
  - symbol: "𒂗"
    unicode: U+12097
    transliteration: EN
    meaning: lord, master, priest
    frequency_hz: 293.66
    note: D4
    wedge_strikes: 3
    duration_ms: 600
    amplitude: 0.90
    
  - symbol: "𒊩"
    unicode: U+122A9
    transliteration: NIN
    meaning: lady, mistress, queen
    frequency_hz: 329.63
    note: E4
    wedge_strikes: 4
    duration_ms: 700
    amplitude: 0.95
    
  - symbol: "𒌷"
    unicode: U+12337
    transliteration: URU
    meaning: city, settlement
    frequency_hz: 220.00
    note: A3
    wedge_strikes: 2
    duration_ms: 500
    amplitude: 0.85

# Wedge Strike Synthesis Parameters
wedge_strike:
  envelope:
    attack_ms: 10
    decay_ms: 30
    sustain_level: 0.0
    release_ms: 10
  
  timbre:
    noise_component:
      type: filtered_pink_noise
      cutoff_low_hz: 100
      cutoff_high_hz: 4000
      amplitude: 0.3
    
    pitched_component:
      type: sine
      frequency_offset_cents: 0  # Centered on glyph frequency
      amplitude: 0.7
  
  spacing_ms: 50
  
  microtonal_variation:
    enabled: true
    range_cents: 5  # ±5 cents per strike for realism

# Clay Tablet Texture
clay_texture:
  scratchy_noise:
    type: filtered_pink_noise
    cutoff_low_hz: 100
    cutoff_high_hz: 4000
    amplitude: 0.05
    continuous: true
  
  reed_pressure:
    envelope_modulation:
      amount: 0.2
      frequency_hz: 3.0  # Slow LFO simulating hand pressure
  
  tablet_resonance:
    filter_type: bandpass
    center_frequency: glyph_frequency
    q_factor: 2.0
    gain_db: 6

# Sonification Algorithm
algorithm:
  steps:
    - name: parse_cuneiform
      description: Parse Unicode cuneiform input
      
    - name: map_to_frequency
      description: Look up glyph frequency from mapping table
      
    - name: generate_wedge_strikes
      description: Create percussive transients based on wedge count
      formula: |
        for strike in range(wedge_strikes):
          generate_transient(
            frequency=glyph_frequency + random_cents(-5, 5),
            envelope=wedge_strike_envelope,
            timbre=wedge_strike_timbre
          )
          delay(spacing_ms)
      
    - name: add_microtonal_cluster
      description: Layer multiple strikes with slight pitch variations
      
    - name: apply_clay_texture
      description: Add filtered noise for tablet scratchiness
      
    - name: apply_tablet_resonance
      description: Bandpass filter at glyph frequency
      
    - name: apply_reverb
      description: Use GSRC reverb (2.8s decay, Schroeder algorithm)

# Example Invocations
examples:
  - name: divine_king
    text: "𒀭 𒈗"
    transliteration: "DINGIR LUGAL"
    translation: "Divine King"
    description: Two-glyph sequence demonstrating frequency contrast
    
  - name: temple_dedication
    text: "𒂗 𒊩 𒌷"
    transliteration: "EN NIN URU"
    translation: "Lord Lady City"
    description: Three-glyph sequence with varying wedge counts

# Historical Context
historical_context:
  writing_system: Cuneiform (wedge-shaped marks in clay)
  origin: Uruk, southern Mesopotamia
  first_use: ~3400 BCE
  decline: ~100 CE
  
  writing_tools:
    stylus: Reed or wooden stylus with triangular tip
    surface: Soft clay tablets
    technique: Pressing stylus at angles to create wedge shapes
  
  acoustic_environment:
    temple_materials: Mud brick, stone
    reverberation: Moderate (1-3 seconds)
    ambient_sound: Market noise, chanting, ritual instruments

# Phonology (Sumerian Language)
phonology:
