---
# GlyphSonix Resonance Core - Kubernetes Deployment
# ==================================================
# 
# Deploy GlyphSonix to the Strategic Khaos swarm
#
# Apply: kubectl apply -f kubernetes-deployment.yaml

apiVersion: v1
kind: Namespace
metadata:
  name: aetherforge
  labels:
    name: aetherforge
    component: sonic-synthesis

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: glyphsonix-config
  namespace: aetherforge
data:
  CARRIER_FREQUENCY: "432.0"
  SAMPLE_RATE: "48000"
  DEFAULT_DURATION: "8.0"
  OUTPUT_DIR: "/app/output"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glyphsonix-engine
  namespace: aetherforge
  labels:
    app: glyphsonix
    component: audio-synthesis
    version: v1.0.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: glyphsonix
  template:
    metadata:
      labels:
        app: glyphsonix
        component: audio-synthesis
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: gsrc
        image: strategickhaos/glyphsonix:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: GLYPHSONIX_CARRIER
          valueFrom:
            configMapKeyRef:
              name: glyphsonix-config
              key: CARRIER_FREQUENCY
        - name: GLYPHSONIX_SAMPLE_RATE
          valueFrom:
            configMapKeyRef:
              name: glyphsonix-config
              key: SAMPLE_RATE
        - name: GLYPHSONIX_DURATION
          valueFrom:
            configMapKeyRef:
              name: glyphsonix-config
              key: DEFAULT_DURATION
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: output
          mountPath: /app/output
        - name: persistent-storage
          mountPath: /app/persistent
      volumes:
      - name: output
        emptyDir:
          sizeLimit: 10Gi
      - name: persistent-storage
        persistentVolumeClaim:
          claimName: glyphsonix-storage

---
apiVersion: v1
kind: Service
metadata:
  name: glyphsonix-service
  namespace: aetherforge
  labels:
    app: glyphsonix
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: glyphsonix

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: glyphsonix-hpa
  namespace: aetherforge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: glyphsonix-engine
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: glyphsonix-ingress
  namespace: aetherforge
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - glyphsonix.strategickhaos.ai
    secretName: glyphsonix-tls
  rules:
  - host: glyphsonix.strategickhaos.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: glyphsonix-service
            port:
              number: 8080

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: glyphsonix-storage
  namespace: aetherforge
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: standard

---
# ServiceMonitor for Prometheus (if using Prometheus Operator)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: glyphsonix-metrics
  namespace: aetherforge
  labels:
    app: glyphsonix
spec:
  selector:
    matchLabels:
      app: glyphsonix
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
