[package]
name = "sagco_crawler_engine"
version = "0.3.0"
edition = "2021"
default-run = "sagco-crawler"

[[bin]]
name = "sagco-crawler"
path = "src/main.rs"

[[bin]]
name = "sagco-run"
path = "sagco_lang_runtime/src/sagco_run.rs"

[[bin]]
name = "sagco-eru"
path = "sagco_lang_runtime/src/sagco_eru.rs"

[dependencies]
sha3 = "0.10"
hex  = "0.4"
