[package]
name        = "sagco-gdrive"
version     = "0.1.0"
edition     = "2021"
description = "SAGCO Google Drive uploader — SHA-256 sealed file sync"
authors     = ["Strategickhaos DAO LLC"]

[[bin]]
name = "sagco-gdrive"
path = "src/main.rs"

[dependencies]
# HTTP client
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
serde_yaml  = "0.9"

# SHA-256
sha2    = "0.10"
hex     = "0.4"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow  = "1"
thiserror = "1"

# File system
walkdir  = "2"
chrono   = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
strip = true
