<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#3b1f0a">
<title>Bell'Aroma Cafe — Choose Your Location</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #1a0f06;
    color: #f5e6d0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  .logo {
    font-size: 2.2rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: #d4a96a;
    text-align: center;
    margin-bottom: 4px;
  }

  .tagline {
    font-size: 0.9rem;
    color: #a07850;
    text-align: center;
    margin-bottom: 36px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .prompt {
    font-size: 1.05rem;
    color: #c8b49a;
    text-align: center;
    margin-bottom: 28px;
    font-weight: 400;
  }

  .locations {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
    max-width: 360px;
  }

  .location-btn {
    display: block;
    width: 100%;
    padding: 22px 24px;
    background: #2e1a0c;
    border: 1.5px solid #5a3520;
    border-radius: 14px;
    text-decoration: none;
    color: #f5e6d0;
    text-align: left;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .location-btn:active {
    background: #3d2010;
    border-color: #d4a96a;
    transform: scale(0.98);
  }

  .location-btn .name {
    font-size: 1.25rem;
    font-weight: 600;
    color: #d4a96a;
    margin-bottom: 4px;
  }

  .location-btn .address {
    font-size: 0.85rem;
    color: #8a6a50;
  }

  .location-btn .arrow {
    float: right;
    font-size: 1.4rem;
    color: #5a3520;
    margin-top: -28px;
  }

  .divider {
    text-align: center;
    color: #4a2e18;
    font-size: 0.8rem;
    margin: 4px 0;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  footer {
    margin-top: 48px;
    font-size: 0.75rem;
    color: #3d2510;
    text-align: center;
  }

  /* Ripple tap feedback */
  .location-btn:focus {
    outline: none;
    border-color: #d4a96a;
  }
</style>
</head>
<body>

<div class="logo">Bell'Aroma</div>
<div class="tagline">Corpus Christi, TX</div>

<div class="prompt">Which location are you visiting?</div>

<div class="locations">

  <a class="location-btn" href="UPTOWN_MENU_URL" id="uptown">
    <div class="name">Uptown</div>
    <div class="address">Uptown Corpus Christi</div>
    <div class="arrow">›</div>
  </a>

  <div class="divider">or</div>

  <a class="location-btn" href="SOUTHSIDE_MENU_URL" id="southside">
    <div class="name">South Side</div>
    <div class="address">South Side Corpus Christi</div>
    <div class="arrow">›</div>
  </a>

</div>

<footer>Tap your location to see the menu</footer>

<script>
  // ── Configuration — update these two URLs before deploying ──────────────
  var LOCATIONS = {
    uptown:    "UPTOWN_MENU_URL",    // e.g. "https://bellaromacafe.com/uptown"
    southside: "SOUTHSIDE_MENU_URL"  // e.g. "https://bellaromacafe.com/southside"
  };
  // ─────────────────────────────────────────────────────────────────────────

  // Wire buttons (overrides href so URLs are only defined once above)
  document.getElementById("uptown").href    = LOCATIONS.uptown;
  document.getElementById("southside").href = LOCATIONS.southside;

  // Optional: log scan event to console (replace with analytics if needed)
  document.querySelectorAll(".location-btn").forEach(function(btn) {
    btn.addEventListener("click", function() {
      var loc = this.id;
      var ts  = new Date().toISOString();
      console.log("bellaroma_scan", { location: loc, timestamp: ts });
      // To wire Google Analytics: gtag('event', 'qr_scan', { location: loc });
    });
  });
</script>

</body>
</html>
