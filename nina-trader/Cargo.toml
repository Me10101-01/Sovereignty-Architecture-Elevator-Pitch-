[package]
name = "nina-trader"
version = "0.1.0"
edition = "2018"
description = "SAGCO-OS Nina Trader Bot — passive income automation engine"
authors = ["StrategicKhaos <domenic.garza@snhu.edu>"]

[[bin]]
name = "nina-trader"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["blocking", "json"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "3.0", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
