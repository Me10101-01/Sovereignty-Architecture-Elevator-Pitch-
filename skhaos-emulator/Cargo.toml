[package]
name = "skhaos-emulator"
version = "0.1.0"
edition = "2021"
authors = ["Strategickhaos DAO LLC"]
description = "Quantum-addressed sovereign web browser proxy with MIDI/music integration"
license = "MIT"

[workspace]
members = [
    "src/proxy_browser",
    "src/audio_midi",
    "src/cli_recon",
]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
hyper = { version = "0.14", features = ["full"] }
url = "2.5"

[dev-dependencies]
mockito = "1.2"
