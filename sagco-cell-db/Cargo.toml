[package]
name = "sagco_db"
version = "0.1.0"
edition = "2021"
description = "SAGCO-CELL-DB — a storage engine built from cells up"

[[bin]]
name = "sagco-db"
path = "src/main.rs"

[dependencies]
crc32fast = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
